name: KCN maintenance build

on:
  push:
    branches: [kcn/7.1-maint]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kcn-maint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.repository == 'KCNyu/openclaw' && github.ref == 'refs/heads/kcn/7.1-maint'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.2"
          use-actions-cache: "false"
      - name: Targeted tests
        run: |
          pnpm test src/cron/service/jobs.apply-patch.test.ts src/cron/service/ops.test.ts
          pnpm test src/config/sessions/session-accessor.test.ts src/commands/daemon-install-helpers.test.ts
          pnpm test packages/memory-host-sdk/src/host/session-files.test.ts packages/memory-host-sdk/src/host/session-files-yield.test.ts
          pnpm test src/agents/embedded-agent-runner/run/attempt.llm-boundary.cache-stability.test.ts
          pnpm test src/agents/embedded-agent-subscribe.handlers.tools.test.ts src/agents/embedded-agent-runner/run/payloads.test.ts
      - name: Pack the Linux desk profile
        run: |
          set -euo pipefail
          export OPENCLAW_BUNDLED_PLUGIN_BUILD_IDS="$(node scripts/kcn-bundled-plugin-ids.mjs)"
          # The correction tag retains base versions in Git. The official
          # install pins both npm packages to the correction version.
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          for (const file of ["package.json", "packages/ai/package.json"]) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            if (pkg.version !== "2026.7.1") throw new Error(`Unexpected base version: ${file}`);
            pkg.version = "2026.7.1-2";
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          }
          NODE
          mkdir -p "$RUNNER_TEMP/kcn-package"
          pnpm pack --pack-destination "$RUNNER_TEMP/kcn-package"
          cd "$RUNNER_TEMP/kcn-package"
          test -f openclaw-2026.7.1-2.tgz
          tar -tzf openclaw-2026.7.1-2.tgz > inventory.txt
          grep -qx 'package/dist/extensions/telegram/openclaw.plugin.json' inventory.txt
          grep -qx 'package/dist/extensions/memory-core/openclaw.plugin.json' inventory.txt
          if grep -E '^package/dist(-runtime)?/extensions/(discord|googlechat|imessage|matrix|mattermost|msteams|signal|slack|zalo)/' inventory.txt; then
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > COMMIT
          sha256sum openclaw-*.tgz > SHA256SUMS
      - name: Check the packed runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kcn-smoke"
          cd "$RUNNER_TEMP/kcn-smoke"
          npm install --no-audit --no-fund "$RUNNER_TEMP"/kcn-package/openclaw-*.tgz
          ./node_modules/.bin/openclaw --version | grep -E "^OpenClaw 2026\.7\.1-2 "
          node --input-type=module -e 'for (const name of ["channel-message", "command-auth", "infra-runtime"]) await import("openclaw/plugin-sdk/" + name);'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-kcn-linux-${{ github.sha }}
          path: ${{ runner.temp }}/kcn-package/
          if-no-files-found: error
          retention-days: 14
