name: KCN maintenance build

on:
  push:
    branches: [kcn/7.1-maint]
  pull_request:
    branches: [kcn/7.1-maint]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kcn-maint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.repository == 'KCNyu/openclaw' && (github.ref == 'refs/heads/kcn/7.1-maint' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.22.2"
          use-actions-cache: "false"
      - name: Targeted tests
        run: |
          pnpm test src/cron/service/jobs.apply-patch.test.ts src/cron/service/ops.test.ts
          pnpm test src/cron/service.failure-alert.test.ts src/gateway/server-cron-notifications.test.ts src/gateway/server.cron.test.ts
          pnpm test src/cron/isolated-agent/channel-output-policy.test.ts src/cron/isolated-agent/run.message-tool-policy.test.ts
          pnpm test src/cron/isolated-agent/run.cron-model-override-forwarding.test.ts src/agents/model-fallback.test.ts
          pnpm test src/llm/providers/stream-wrappers/minimax.test.ts
          pnpm test src/config/sessions/session-accessor.test.ts src/commands/daemon-install-helpers.test.ts
          pnpm test packages/memory-host-sdk/src/host/session-files.test.ts packages/memory-host-sdk/src/host/session-files-yield.test.ts
          pnpm test src/agents/embedded-agent-runner/run/attempt.llm-boundary.cache-stability.test.ts
          pnpm test src/agents/embedded-agent-subscribe.handlers.tools.test.ts src/agents/embedded-agent-runner/run/payloads.test.ts
          pnpm test src/infra/sqlite-wal.test.ts src/gateway/server-channels.test.ts src/gateway/channel-health-monitor.test.ts src/agents/bash-tools.exec-runtime.test.ts src/logging/diagnostic.test.ts
          pnpm test src/agents/tool-display.test.ts src/agents/weixin-tool-failure-streak.test.ts
          pnpm test src/agents/embedded-agent-runner/run/payloads.errors.test.ts src/auto-reply/reply/agent-runner-usage-line.test.ts
          pnpm test src/agents/embedded-agent-runner/run.incomplete-turn.test.ts src/agents/embedded-agent-runner/run/tool-media-payloads.test.ts
          pnpm test extensions/telegram/src/webhook.test.ts
          pnpm test extensions/memory-core/src/tools.test.ts extensions/memory-core/src/tools.citations.test.ts extensions/memory-core/src/memory/manager-search.test.ts
          pnpm test extensions/memory-core/src/dreaming.test.ts extensions/memory-core/src/short-term-promotion.test.ts
          pnpm test packages/memory-host-sdk/src/host/embeddings.test.ts src/auto-reply/usage-bar/translator.test.ts
          pnpm test src/agents/harness/native-hook-relay.test.ts src/agents/provider-transport-fetch.test.ts
      - name: Pack the Linux desk profile
        run: |
          set -euo pipefail
          export OPENCLAW_BUNDLED_PLUGIN_BUILD_IDS="$(node scripts/kcn-bundled-plugin-ids.mjs)"
          # The correction tag retains base versions in Git. The official
          # install pins both npm packages to the correction version.
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          for (const file of ["package.json", "packages/ai/package.json"]) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            if (pkg.version !== "2026.7.1") throw new Error(`Unexpected base version: ${file}`);
            pkg.version = "2026.7.1-2";
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          }
          NODE
          mkdir -p "$RUNNER_TEMP/kcn-package"
          pnpm pack --pack-destination "$RUNNER_TEMP/kcn-package"
          cd "$RUNNER_TEMP/kcn-package"
          test -f openclaw-2026.7.1-2.tgz
          tar -tzf openclaw-2026.7.1-2.tgz > inventory.txt
          grep -qx 'package/dist/extensions/telegram/openclaw.plugin.json' inventory.txt
          grep -qx 'package/dist/extensions/memory-core/openclaw.plugin.json' inventory.txt
          if grep -E '^package/dist(-runtime)?/extensions/(discord|googlechat|imessage|matrix|mattermost|msteams|signal|slack|zalo)/' inventory.txt; then
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > COMMIT
          sha256sum openclaw-*.tgz > SHA256SUMS
      - name: Check the packed runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kcn-smoke"
          cd "$RUNNER_TEMP/kcn-smoke"
          npm install --no-audit --no-fund "$RUNNER_TEMP"/kcn-package/openclaw-*.tgz
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { commit } = JSON.parse(readFileSync("node_modules/openclaw/dist/build-info.json", "utf8"));
            if (commit !== process.env.GITHUB_SHA) throw new Error(`Packed commit ${commit} does not match ${process.env.GITHUB_SHA}`);
          '
          env -u GIT_COMMIT -u GIT_SHA ./node_modules/.bin/openclaw --version |
            grep -Fx "OpenClaw 2026.7.1-2 (${GITHUB_SHA:0:7})"
          node --input-type=module -e 'for (const name of ["channel-message", "command-auth", "infra-runtime"]) await import("openclaw/plugin-sdk/" + name);'
      - if: github.ref == 'refs/heads/kcn/7.1-maint'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-kcn-linux-${{ github.sha }}
          path: ${{ runner.temp }}/kcn-package/
          if-no-files-found: error
          retention-days: 14
